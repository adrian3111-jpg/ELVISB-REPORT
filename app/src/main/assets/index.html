<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>ELVISB Report</title>
<style>
:root{--bg:#f1f5f9;--panel:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--danger:#b91c1c;--r:15px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:20;background:#0f172a;color:#fff;padding:14px 16px}.brand{font-weight:900}.sub{font-size:12px;color:#cbd5e1;margin-top:2px}
.wrap{max-width:1100px;margin:auto;padding:12px}.layout{display:grid;grid-template-columns:260px 1fr;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:0;border-radius:11px;padding:10px 13px;font-weight:800;background:#e2e8f0;color:#0f172a}.primary{background:var(--accent);color:#fff}.dark{background:#0f172a;color:#fff}.danger{background:#fee2e2;color:var(--danger)}
h2{font-size:17px;margin:0}.small{font-size:12px;color:var(--muted)}.list{display:grid;gap:8px;margin-top:12px;max-height:65vh;overflow:auto}.item{border:1px solid var(--line);padding:10px;border-radius:10px;background:#fff}.item.active{border-color:#60a5fa;background:#eff6ff}.item b{display:block;font-size:13px}.item span{font-size:11px;color:var(--muted)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.field{display:grid;gap:5px}.full{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:var(--muted)}.field input,.field select{border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%}
.settings{margin-top:10px;padding:10px;background:#f8fafc;border-radius:11px;display:none}.settings.open{display:block}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:12px}.photo{overflow:hidden;padding:0}.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#111827}.body{padding:10px}.body textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;margin:7px 0}.empty{text-align:center;padding:34px;border:2px dashed var(--line);border-radius:12px;margin-top:12px;color:var(--muted)}
.modal{position:fixed;inset:0;z-index:100;background:#020617ee;display:none;align-items:center;justify-content:center;padding:10px}.modal.open{display:flex}.cam{width:min(780px,100%);background:#000;border-radius:16px;overflow:hidden;position:relative}.cam video{width:100%;max-height:74vh;display:block}.camtop{position:absolute;left:0;right:0;top:0;padding:10px;display:flex;justify-content:space-between}.stampLive{position:absolute;right:12px;bottom:94px;background:#000a;color:#fff;padding:7px 9px;border-radius:7px;font-weight:800;font-size:13px}.cambottom{padding:13px;display:flex;justify-content:center}.shutter{width:66px;height:66px;border-radius:50%;border:6px solid #fff;background:#ffffff55}.close{background:#fff}
.notice{margin-top:10px;padding:9px 10px;border-radius:9px;background:#ecfdf5;color:#065f46;font-size:12px}
.printComment{display:none}
@media(max-width:760px){.layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.full{grid-column:auto}.list{max-height:180px}.photos{grid-template-columns:1fr}}
@media print{.top,.side,.actions,.settings,.body textarea,.mini{display:none!important}.layout{display:block}.wrap{padding:0}.main{border:0}.photos{display:block}.photo{border:0;page-break-inside:avoid;margin-bottom:22px}.photo img{aspect-ratio:auto;max-height:680px;object-fit:contain}.printComment{display:block!important;margin-top:8px}}
</style>
</head>
<body>
<div class="top"><div class="brand">ELVISB Report</div><div class="sub">Reporte fotográfico · cámara con timestamp integrado</div></div>
<div class="wrap"><div class="layout">
<aside class="card side">
  <div class="row between"><h2>Reportes</h2><button class="btn primary" id="newBtn">+ Nuevo</button></div>
  <div class="list" id="reportList"></div>
  <div class="small" style="margin-top:10px">Sin cuenta ni suscripción. No hay límite artificial de reportes o fotografías.</div>
</aside>
<main class="card main">
  <div class="row between"><div><h2 id="activeTitle">Reporte activo</h2><div class="small" id="counter">0 fotos</div></div>
    <div class="row actions">
      <button class="btn primary" id="cameraBtn">📷 Cámara</button>
      <button class="btn" id="galleryBtn">🖼 Galería</button>
      <input id="gallery" type="file" accept="image/*" multiple hidden>
      <button class="btn" id="settingsBtn">⚙ Timestamp</button>
      <button class="btn dark" id="pdfBtn">PDF</button>
    </div>
  </div>
  <div class="settings" id="settings">
    <div class="fields" style="margin-top:0">
      <div class="field"><label>Formato</label><select id="format"><option value="dmy">DD/MM/AAAA HH:mm:ss</option><option value="ymd">AAAA-MM-DD HH:mm:ss</option></select></div>
      <div class="field"><label>Posición</label><select id="pos"><option value="br">Abajo derecha</option><option value="bl">Abajo izquierda</option><option value="tr">Arriba derecha</option><option value="tl">Arriba izquierda</option></select></div>
      <label class="small"><input type="checkbox" id="stampProject" checked> Incluir proyecto</label>
      <label class="small"><input type="checkbox" id="stampGallery"> Timestamp también en fotos importadas</label>
    </div>
  </div>
  <div class="fields">
    <div class="field full"><label>Título</label><input id="title" placeholder="Reporte fotográfico"></div>
    <div class="field"><label>Proyecto</label><input id="project" placeholder="Proyecto"></div>
    <div class="field"><label>Cliente</label><input id="client" placeholder="Cliente"></div>
    <div class="field"><label>Elaborado por</label><input id="author" value="Elvis Barrantes"></div>
    <div class="field"><label>Ubicación</label><input id="location" placeholder="Ubicación"></div>
  </div>
  <div class="notice"><b>Timestamp real:</b> la cámara incrusta fecha y hora dentro del JPEG antes de guardarlo en el reporte.</div>
  <div id="photoArea"></div>
</main>
</div></div>

<div class="modal" id="cameraModal"><div class="cam">
  <video id="video" autoplay playsinline muted></video>
  <div class="camtop"><button class="btn close" id="closeCam">Cerrar</button><span class="small" style="color:white">Cámara interna</span></div>
  <div class="stampLive" id="live"></div>
  <div class="cambottom"><button class="shutter" id="shutter" aria-label="Tomar foto"></button></div>
</div></div>
<canvas id="canvas" hidden></canvas>

<script>
const DB='elvisb_report_db', STORE='reports';
let db,reports=[],currentId=null,stream=null;
const $=x=>document.getElementById(x);
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
const now=()=>new Date().toISOString();
function fmt(v,mode='dmy'){const d=new Date(v),p=n=>String(n).padStart(2,'0');const da=mode==='ymd'?d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()):p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();return da+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())}
function fresh(){return{id:uid(),title:'Reporte fotográfico',project:'',client:'',author:'Elvis Barrantes',location:'',createdAt:now(),updatedAt:now(),settings:{format:'dmy',pos:'br',project:true,gallery:false},photos:[]}}
function openDb(){return new Promise((ok,no)=>{const q=indexedDB.open(DB,1);q.onupgradeneeded=e=>e.target.result.createObjectStore(STORE,{keyPath:'id'});q.onsuccess=e=>{db=e.target.result;ok()};q.onerror=()=>no(q.error)})}
function all(){return new Promise((ok,no)=>{const q=db.transaction(STORE).objectStore(STORE).getAll();q.onsuccess=()=>ok(q.result||[]);q.onerror=()=>no(q.error)})}
function put(r){return new Promise((ok,no)=>{const q=db.transaction(STORE,'readwrite').objectStore(STORE).put(r);q.onsuccess=ok;q.onerror=()=>no(q.error)})}
const cur=()=>reports.find(x=>x.id===currentId);
async function save(){const r=cur();if(!r)return;r.updatedAt=now();await put(r);renderList();$('counter').textContent=r.photos.length+' fotos'}
async function makeReport(){const r=fresh();reports.push(r);currentId=r.id;await put(r);loadFields();render()}
function renderList(){const box=$('reportList');box.innerHTML='';[...reports].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).forEach(r=>{const d=document.createElement('div');d.className='item'+(r.id===currentId?' active':'');d.innerHTML='<b></b><span></span>';d.querySelector('b').textContent=r.title||'Sin título';d.querySelector('span').textContent=(r.project||'Sin proyecto')+' · '+r.photos.length+' fotos';d.onclick=()=>{currentId=r.id;loadFields();render()};box.appendChild(d)})}
function loadFields(){const r=cur();if(!r)return;['title','project','client','author','location'].forEach(k=>$(k).value=r[k]||'');$('format').value=r.settings.format;$('pos').value=r.settings.pos;$('stampProject').checked=r.settings.project;$('stampGallery').checked=r.settings.gallery;$('activeTitle').textContent=r.title||'Reporte activo'}
function readFields(){const r=cur();if(!r)return;['title','project','client','author','location'].forEach(k=>r[k]=$(k).value);r.settings={format:$('format').value,pos:$('pos').value,project:$('stampProject').checked,gallery:$('stampGallery').checked};$('activeTitle').textContent=r.title||'Reporte activo'}
function render(){renderList();renderPhotos();$('counter').textContent=cur().photos.length+' fotos'}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function renderPhotos(){const r=cur(),area=$('photoArea');if(!r.photos.length){area.innerHTML='<div class="empty"><b>Aún no hay fotos</b><br><span class="small">Usa Cámara o Galería.</span></div>';return}area.innerHTML='<div class="photos" id="photos"></div>';const g=$('photos');r.photos.forEach((p,i)=>{const c=document.createElement('div');c.className='card photo';c.innerHTML='<img><div class="body"><div class="small meta"></div><textarea placeholder="Comentario / observación"></textarea><div class="printComment"></div><div class="row mini"><button class="btn up">↑</button><button class="btn down">↓</button><button class="btn danger del">Eliminar</button></div></div>';c.querySelector('img').src=p.data;c.querySelector('.meta').textContent='Foto '+(i+1)+' · '+(p.source==='camera'?fmt(p.at,r.settings.format):'Galería');const ta=c.querySelector('textarea');ta.value=p.comment||'';c.querySelector('.printComment').textContent=p.comment||'Sin comentario';ta.oninput=debounce(async()=>{p.comment=ta.value;c.querySelector('.printComment').textContent=p.comment||'Sin comentario';await save()},300);c.querySelector('.del').onclick=async()=>{r.photos.splice(i,1);await save();renderPhotos()};c.querySelector('.up').onclick=async()=>{if(i>0){[r.photos[i-1],r.photos[i]]=[r.photos[i],r.photos[i-1]];await save();renderPhotos()}};c.querySelector('.down').onclick=async()=>{if(i<r.photos.length-1){[r.photos[i+1],r.photos[i]]=[r.photos[i],r.photos[i+1]];await save();renderPhotos()}};g.appendChild(c)})}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function round(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function stamp(ctx,w,h,date,settings,project,prefix=''){const lines=[prefix+fmt(date,settings.format)];if(settings.project&&project)lines.push(project);const fs=Math.max(20,Math.round(w*.025)),pad=Math.round(fs*.55),lh=Math.round(fs*1.25);ctx.font='700 '+fs+'px Arial';const bw=Math.max(...lines.map(t=>ctx.measureText(t).width))+pad*2,bh=lines.length*lh+pad*1.3;let x=pad,y=pad;if(settings.pos.endsWith('r'))x=w-bw-pad;if(settings.pos.startsWith('b'))y=h-bh-pad;ctx.fillStyle='rgba(0,0,0,.68)';round(ctx,x,y,bw,bh,Math.round(fs*.25));ctx.fill();ctx.fillStyle='#fff';ctx.textBaseline='top';lines.forEach((t,i)=>ctx.fillText(t,x+pad,y+pad*.45+i*lh))}
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});$('video').srcObject=stream;$('cameraModal').classList.add('open');live()}catch(e){alert('No se pudo abrir la cámara interna. Revisa el permiso de cámara.');}}
function stopCamera(){if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}$('cameraModal').classList.remove('open')}
function live(){if(!$('cameraModal').classList.contains('open'))return;const r=cur();$('live').innerHTML=esc(fmt(new Date(),r.settings.format))+(r.settings.project&&r.project?'<br>'+esc(r.project):'');setTimeout(live,500)}
async function capture(){const v=$('video');if(!v.videoWidth)return;const c=$('canvas'),r=cur();c.width=v.videoWidth;c.height=v.videoHeight;const x=c.getContext('2d');x.drawImage(v,0,0,c.width,c.height);const at=new Date();stamp(x,c.width,c.height,at,r.settings,r.project);r.photos.push({id:uid(),data:c.toDataURL('image/jpeg',.88),at:at.toISOString(),source:'camera',comment:''});await save();renderPhotos();stopCamera()}
function fileUrl(f){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(f)})}
function img(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src})}
async function addFile(f){const r=cur(),raw=await fileUrl(f),im=await img(raw),max=2200,sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),w=Math.round(im.naturalWidth*sc),h=Math.round(im.naturalHeight*sc),c=$('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(im,0,0,w,h);const at=new Date();if(r.settings.gallery)stamp(x,w,h,at,r.settings,r.project,'IMPORTADA · ');r.photos.push({id:uid(),data:c.toDataURL('image/jpeg',.88),at:at.toISOString(),source:'gallery',comment:''});await save()}
async function importFiles(files){for(const f of files){if(f.type.startsWith('image/'))await addFile(f)}renderPhotos()}
function bind(){['title','project','client','author','location'].forEach(k=>$(k).oninput=debounce(async()=>{readFields();await save()},250));['format','pos','stampProject','stampGallery'].forEach(k=>$(k).onchange=async()=>{readFields();await save()});$('newBtn').onclick=makeReport;$('cameraBtn').onclick=startCamera;$('closeCam').onclick=stopCamera;$('shutter').onclick=capture;$('galleryBtn').onclick=()=>$('gallery').click();$('gallery').onchange=async e=>{await importFiles([...e.target.files]);e.target.value=''};$('settingsBtn').onclick=()=>$('settings').classList.toggle('open');$('pdfBtn').onclick=()=>{readFields();if(!cur().photos.length)return alert('Agrega al menos una foto.');if(window.__ELVISB_ANDROID__)prompt('__ELVISB_PRINT__');else window.print()}}
(async()=>{bind();await openDb();reports=await all();if(!reports.length)await makeReport();else{currentId=[...reports].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt))[0].id;loadFields();render()}})().catch(e=>alert('Error al iniciar: '+e.message));
</script>
</body>
</html>
