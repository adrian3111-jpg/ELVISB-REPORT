plugins { id 'com.android.application' }

android {
    namespace 'pe.elvisb.report'
    compileSdk 35

    defaultConfig {
        applicationId 'pe.elvisb.report'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '2.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
